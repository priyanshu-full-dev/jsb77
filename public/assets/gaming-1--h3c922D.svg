<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <defs>
    <!-- Gradient for Curacao Gaming crest -->
    <linearGradient id="gc-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="40%" stop-color="#c10931" />
      <stop offset="70%" stop-color="#7000aa" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="gc-gradient-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="50%" stop-color="#ff0077" />
      <stop offset="100%" stop-color="#330066" />
    </linearGradient>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Curacao Emblem Badge -->
    <g transform="translate(0, 4)">
      <!-- Outer colorful ribbon shape -->
      <path d="M 45 4 C 65 4 80 18 80 38 C 80 58 60 72 38 72 C 16 72 2 58 2 38 C 2 18 25 4 45 4 Z" fill="url(#gc-gradient-1)" />
      <!-- Inner swoosh / depth -->
      <path d="M 42 8 C 60 8 74 20 74 38 C 74 54 58 66 38 66 C 20 66 8 54 8 38 C 8 26 22 14 36 10" fill="url(#gc-gradient-2)" opacity="0.85" />
      <!-- Swirl highlight -->
      <path d="M 12 40 C 14 26 26 12 42 12 C 58 12 70 24 68 38 C 66 50 52 62 36 62" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />
      <!-- GC Text inside emblem -->
      <text x="40" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">GC</text>
    </g>

    <!-- GAMING CURACAO Text -->
    <g transform="translate(95, 34)">
      <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#4b5563" letter-spacing="1">GAMING</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="2">CURACAO</text>
    </g>
  </g>
</svg>
