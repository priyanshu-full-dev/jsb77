<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="100%" height="100%">
  <defs>
    <linearGradient id="auraChipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#4169e1"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  <g transform="translate(15, 14)">
    <!-- Chip Outer Ring -->
    <circle cx="26" cy="26" r="22" fill="none" stroke="url(#auraChipGrad)" stroke-width="4"/>
    <circle cx="26" cy="26" r="16" fill="#1e1e2d"/>
    <!-- Chip Dashes -->
    <circle cx="26" cy="26" r="11" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="26" cy="26" r="6" fill="url(#auraChipGrad)"/>
    <!-- Text -->
    <text x="58" y="27" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#1f2937" letter-spacing="2">AURA</text>
    <text x="59" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#4b5563" letter-spacing="1.5">EGAMING</text>
  </g>
</svg>
