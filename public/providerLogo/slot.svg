<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#5c4308"/>
    </linearGradient>
  </defs>
  <g transform="translate(20, 10)">
    <!-- Badge Background -->
    <path d="M10 28 L30 10 L130 10 L150 28 L130 46 L30 46 Z" fill="#1e1e24" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Banner inner -->
    <path d="M20 28 L35 15 L125 15 L140 28 L125 41 L35 41 Z" fill="#111" />
    <!-- CASINO text -->
    <text x="80" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" fill="url(#goldGrad)" letter-spacing="3">CASINO</text>
    <!-- SLOTS text -->
    <text x="80" y="38" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" fill="#fff" letter-spacing="1">SLOTS</text>
  </g>
</svg>
