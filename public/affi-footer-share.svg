<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Outer Glow / Shadow -->
    <filter id="shadow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Radial Gradient for button body -->
    <radialGradient id="discGrad" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#ff1a4b"/>
      <stop offset="45%" stop-color="#cc0832"/>
      <stop offset="80%" stop-color="#8a021e"/>
      <stop offset="100%" stop-color="#54000f"/>
    </radialGradient>
    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a0414"/>
      <stop offset="100%" stop-color="#36010a"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Halo Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#ringGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Inner Radiant Glossy Button -->
  <circle cx="50" cy="50" r="38" fill="url(#discGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Top Inner Light Arc for 3D glassy effect -->
  <path d="M22 45 A 30 30 0 0 1 78 45" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Clean White Interconnected Share Nodes -->
  <g transform="translate(50, 50) scale(1.35) translate(-12, -12)">
    <!-- Connecting Lines -->
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>

    <!-- 3 Nodes -->
    <circle cx="18" cy="5" r="3.2" fill="#ffffff"/>
    <circle cx="6" cy="12" r="3.2" fill="#ffffff"/>
    <circle cx="18" cy="19" r="3.2" fill="#ffffff"/>
  </g>
</svg>
