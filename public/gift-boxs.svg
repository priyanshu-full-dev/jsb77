<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Confetti / Stars floating from top -->
  <!-- Star Top Right -->
  <polygon points="102,18 104.5,23.5 110,24.5 106,28.5 107,34 102,31 97,34 98,28.5 94,24.5 99.5,23.5" fill="#FBBF24" />
  <!-- Small Star Left -->
  <polygon points="28,24 29.5,27.5 33,28 30.5,31 31,34.5 28,32.5 25,34.5 25.5,31 23,28 26.5,27.5" fill="#FBBF24" />
  <!-- Confetti Dots & Streaks -->
  <circle cx="70" cy="18" r="2.5" fill="#38BDF8" />
  <circle cx="50" cy="12" r="2" fill="#F43F5E" />
  <circle cx="86" cy="28" r="2" fill="#A855F7" />
  <circle cx="38" cy="22" r="2" fill="#F59E0B" />
  
  <rect x="76" y="24" width="3" height="8" rx="1.5" transform="rotate(30 76 24)" fill="#38BDF8" />
  <rect x="42" y="16" width="3" height="7" rx="1.5" transform="rotate(-25 42 16)" fill="#FB7185" />
  <rect x="88" y="12" width="2.5" height="6" rx="1" transform="rotate(45 88 12)" fill="#FBBF24" />
  <rect x="32" y="32" width="2.5" height="6" rx="1" transform="rotate(-40 32 32)" fill="#34D399" />
  <rect x="62" y="8" width="2" height="7" rx="1" transform="rotate(15 62 8)" fill="#FBBF24" />

  <!-- Confetti Streamers Bursting -->
  <path d="M52 28 Q44 20 48 10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M68 28 Q76 18 70 8" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Gift Box Bow -->
  <!-- Left Bow Loop -->
  <path d="M58 40 C52 28 36 28 40 40 C44 48 56 42 58 40 Z" fill="#38BDF8" />
  <path d="M55 38 C50 30 40 30 42 38 C44 43 53 39 55 38 Z" fill="#0284C7" opacity="0.3"/>
  
  <!-- Right Bow Loop -->
  <path d="M62 40 C68 28 84 28 80 40 C76 48 64 42 62 40 Z" fill="#38BDF8" />
  <path d="M65 38 C70 30 80 30 78 38 C76 43 67 39 65 38 Z" fill="#0284C7" opacity="0.3"/>
  
  <!-- Ribbon Knot -->
  <circle cx="60" cy="40" r="5" fill="#0284C7" />

  <!-- Gift Box Lid (slightly angled up) -->
  <g transform="rotate(-4 60 48)">
    <rect x="28" y="42" width="64" height="12" rx="3" fill="#FB7185" />
    <!-- Lid Ribbon -->
    <rect x="55" y="42" width="10" height="12" fill="#38BDF8" />
  </g>

  <!-- Gift Box Body -->
  <rect x="34" y="52" width="52" height="48" rx="4" fill="#E11D48" />
  <rect x="34" y="52" width="26" height="48" rx="4" fill="#F43F5E" />
  
  <!-- Vertical Ribbon on Body -->
  <rect x="55" y="52" width="10" height="48" fill="#38BDF8" />
  
  <!-- Horizontal Ribbon on Body (optional decorative shadow) -->
  <line x1="34" y1="52" x2="86" y2="52" stroke="#BE123C" stroke-width="2"/>
</svg>
